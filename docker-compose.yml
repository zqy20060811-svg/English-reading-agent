services:
  pgsql:
    image: pgvector/pgvector:pg16   # postgres:16 + pgvector 向量扩展
    environment:
      POSTGRES_DB: english_reading_agent
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5435:5432"
    volumes:
      - pgsql_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d english_reading_agent"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine   # 本地已拉取的镜像
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"  
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgsql_data:
  redis_data:
