<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>English Reading — 书架</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet" />
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          brand: {
            50: '#EEF6FF', 100: '#D9EAFF', 200: '#B3D4FF', 400: '#6BA9FF',
            500: '#3B82F6', 600: '#2563EB', 700: '#1D4ED8'
          },
          mint: { 400: '#34D399', 500: '#10B981', 600: '#059669' },
          ink: '#1F2937',
          muted: '#6B7280'
        },
        boxShadow: {
          soft: '0 10px 30px rgba(59, 130, 246, 0.08)',
          card: '0 20px 40px rgba(31, 41, 55, 0.08)',
          glow: '0 15px 40px rgba(59, 130, 246, 0.25)'
        }
      }
    }
  }
</script>
<style>
  body {
    font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    background: #FBF7F1;
    color: #1F2937;
  }

  .fade-in { animation: fadeIn 0.35s ease both; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* 无封面书的树皮纹理占位（书名/作者展示） */
  .cover-fallback {
    background:
      repeating-linear-gradient(95deg, rgba(0,0,0,.10) 0 2px, rgba(0,0,0,0) 2px 5px, rgba(255,255,255,.05) 5px 6px, rgba(0,0,0,0) 6px 11px),
      repeating-linear-gradient(88deg, rgba(0,0,0,.06) 0 8px, rgba(0,0,0,0) 8px 16px),
      linear-gradient(165deg, #8a5a33 0%, #6b4226 45%, #4a2c17 100%);
    color: #f3e2c7;
    box-shadow: inset 0 0 32px rgba(0, 0, 0, .38);
    border: 1px solid rgba(255, 255, 255, .10);
  }
  .cover-fallback-title {
    font-family: Georgia, 'Times New Roman', 'Songti SC', serif;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /* ===== 侧边栏收起 ===== */
  .sidebar-aside { transition: width .25s ease, transform .25s ease; }
  .main-shift { transition: margin-left .25s ease; }
  .sidebar-aside.collapsed { width: 5rem; }
  .sidebar-aside.collapsed .brand-title { display: none; }
  .sidebar-aside.collapsed .nav-label,
  .sidebar-aside.collapsed .side-hide { display: none; }
  .sidebar-aside.collapsed .nav-item { justify-content: center; }
  .sidebar-aside.collapsed .side-mini { display: block; }
  .main-shift.collapsed-main { margin-left: 5rem; }
</style>
</head>
<body class="min-h-screen">

<div class="min-h-screen flex">

  <!-- ================= 侧边栏（可收起） ================= -->
  <aside id="sidebar-aside" class="sidebar-aside w-64 bg-white shadow-soft flex flex-col fixed inset-y-0 left-0 z-30">
    <button onclick="toggleSidebar()" title="收起 / 展开菜单"
            class="absolute -right-3 top-20 w-6 h-6 rounded-full bg-white shadow-card border border-gray-100 text-muted hover:text-brand-600 items-center justify-center text-xs z-40 flex">
      <i id="sidebar-toggle-icon" class="fa fa-angle-left"></i>
    </button>

    <div class="p-6 flex items-center gap-3">
      <div class="w-10 h-10 shrink-0 rounded-xl bg-gradient-to-br from-brand-500 to-brand-400 flex items-center justify-center text-white shadow-glow">
        <i class="fa fa-book"></i>
      </div>
      <span class="brand-title font-bold text-lg">English Reading</span>
    </div>

    <nav class="flex-1 px-4 space-y-1">
      <div class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl text-muted hover:bg-gray-50 cursor-pointer transition" onclick="location.href='home.html#home'" title="学习中心">
        <i class="fa fa-home w-5 text-center"></i><span class="nav-label">学习中心</span>
      </div>
      <div class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl bg-brand-50 text-brand-700 font-semibold cursor-pointer transition" title="书架">
        <i class="fa fa-th-large w-5 text-center"></i><span class="nav-label">书架</span>
      </div>
      <div class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl text-muted hover:bg-gray-50 cursor-pointer transition" onclick="location.href='home.html#read'" title="阅读">
        <i class="fa fa-book w-5 text-center"></i><span class="nav-label">阅读</span>
      </div>
      <div class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl text-muted hover:bg-gray-50 cursor-pointer transition" onclick="location.href='home.html#test'" title="水平测试">
        <i class="fa fa-pencil-square w-5 text-center"></i><span class="nav-label">水平测试</span>
      </div>
      <div class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl text-muted hover:bg-gray-50 cursor-pointer transition" onclick="location.href='home.html#translate'" title="翻译">
        <i class="fa fa-language w-5 text-center"></i><span class="nav-label">翻译</span>
      </div>
    </nav>

    <div class="p-4 side-hide">
      <div class="rounded-2xl bg-gradient-to-br from-brand-500 to-brand-400 p-5 text-white shadow-glow">
        <div class="text-sm opacity-90">当前用户</div>
        <div id="side-username" class="text-xl font-bold mt-1">—</div>
        <div id="side-level" class="text-xs mt-3 opacity-90">等级：未测试</div>
        <button onclick="doLogout()" class="mt-4 w-full py-2 rounded-xl bg-white/15 border border-white/40 text-sm hover:bg-white/25 transition">
          <i class="fa fa-sign-out mr-1"></i>退出登录
        </button>
      </div>
    </div>

    <!-- 收起态：迷你头像 + 退出 -->
    <div class="side-mini hidden p-4 pt-2">
      <div class="w-10 h-10 mx-auto rounded-full bg-gradient-to-br from-brand-500 to-brand-400 text-white flex items-center justify-center font-bold" id="side-mini-avatar">R</div>
      <button onclick="doLogout()" title="退出登录"
              class="mt-3 w-10 h-10 mx-auto rounded-full bg-brand-50 text-brand-600 hover:bg-brand-100 flex items-center justify-center transition">
        <i class="fa fa-sign-out"></i>
      </button>
    </div>
  </aside>

  <!-- ================= 主内容 ================= -->
  <main id="main-shift" class="main-shift flex-1 ml-64">

    <!-- 顶部栏 -->
    <header class="sticky top-0 z-20 bg-white/80 backdrop-blur-md border-b border-gray-100 flex items-center justify-between px-8 py-4">
      <h2 class="text-xl font-bold">书架</h2>
      <div class="flex items-center gap-3">
        <div class="flex items-center gap-3 pl-4 border-l border-gray-100">
          <div class="w-9 h-9 rounded-full bg-gradient-to-br from-brand-400 to-brand-600 flex items-center justify-center text-white font-semibold" id="topbar-avatar">R</div>
          <div class="text-sm">
            <div id="topbar-username" class="font-semibold">—</div>
            <div id="topbar-level" class="text-muted text-xs">等级：未测试</div>
          </div>
        </div>
      </div>
    </header>

    <section class="p-8 fade-in">
      <div class="max-w-7xl mx-auto">

        <!-- 搜索与筛选 -->
        <div class="bg-white rounded-2xl shadow-soft p-5 mb-6">
          <div class="flex items-center gap-3 mb-4">
            <div class="relative flex-1 max-w-md">
              <i class="fa fa-search absolute left-4 top-1/2 -translate-y-1/2 text-gray-300"></i>
              <input id="search-input" type="text" placeholder="搜索书名或作者..."
                     class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-gray-50 border border-gray-200 focus:border-brand-500 outline-none text-sm"
                     oninput="onSearchInput()" />
            </div>
            <span id="shelf-count" class="ml-auto text-sm text-muted"></span>
          </div>
          <!-- 分类与难度筛选（客户端过滤，标签由书库动态生成） -->
          <div id="shelf-filters" class="space-y-2"></div>
        </div>

        <!-- 书籍网格 -->
        <div id="book-grid" class="grid md:grid-cols-2 lg:grid-cols-4 xl:grid-cols-5 gap-5">
          <div class="col-span-full text-center text-muted py-12"><i class="fa fa-circle-o-notch fa-spin mr-2"></i>书架加载中...</div>
        </div>
      </div>
    </section>
  </main>
</div>

<!-- 全局提示 -->
<div id="toast" class="hidden"></div>

<script>
  // 后端 API 地址：本地开发环境 FastAPI 服务
  const API_BASE = 'http://127.0.0.1:8002';
  const TOKEN_KEY = 'era_access_token';
  const USER_KEY = 'era_username';
  const PENDING_KEY = 'era_pending_book';

  // 未登录跳回登录页
  if (!localStorage.getItem(TOKEN_KEY)) location.href = 'index.html';

  async function api(path, { method = 'GET', body } = {}) {
    const resp = await fetch(API_BASE + path, {
      method,
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + localStorage.getItem(TOKEN_KEY),
      },
      body: body ? JSON.stringify(body) : undefined,
    });
    if (resp.status === 401) {
      localStorage.clear();
      location.href = 'index.html';
      throw new Error('登录已过期');
    }
    const data = await resp.json().catch(() => ({}));
    if (!resp.ok) {
      let msg = data.detail || `请求失败（${resp.status}）`;
      if (Array.isArray(msg)) msg = msg[0].msg;
      throw new Error(msg);
    }
    return data;
  }

  function toast(text, type = 'error') {
    const el = document.getElementById('toast');
    el.className = 'fixed bottom-8 left-1/2 -translate-x-1/2 z-50 px-6 py-3 rounded-xl shadow-card text-white text-sm ' +
      (type === 'error' ? 'bg-red-500' : 'bg-mint-600');
    el.textContent = text;
    el.classList.remove('hidden');
    clearTimeout(el._timer);
    el._timer = setTimeout(() => el.classList.add('hidden'), 3000);
  }

  function doLogout() {
    localStorage.removeItem(TOKEN_KEY);
    localStorage.removeItem(USER_KEY);
    localStorage.removeItem('era_last_book');
    location.href = 'index.html';
  }

  // ================= 书架 =================
  let ALL_BOOKS = [];
  // 筛选状态（分类标签 + 难度等级 + 关键词，均客户端过滤）
  let SHELF_FILTER = { genre: '全部', level: '全部', search: '' };

  const LEVEL_NAMES = { A1: '入门', A2: '基础', B1: '中级', B2: '中高级', C1: '高级' };

  // 按全书词数粗略分档（与推荐难度上限同源的近似口径）
  function levelOf(wordCount) {
    if (!wordCount) return 'A1';
    if (wordCount < 8000) return 'A1';
    if (wordCount < 20000) return 'A2';
    if (wordCount < 45000) return 'B1';
    if (wordCount < 80000) return 'B2';
    return 'C1';
  }

  function coverHtml(book, extra = 'h-44') {
    // 无封面时：棕色树皮纹理占位，展示书名/作者
    const grad = `<div class="${extra} rounded-2xl shadow-card cover-fallback flex items-center justify-center p-4">
      <div class="text-center px-1">
        <div class="text-[10px] uppercase tracking-widest opacity-80">${book.author || ''}</div>
        <div class="cover-fallback-title mt-2 font-bold text-sm leading-snug">${book.title}</div>
        <div class="mt-2 mx-auto w-10 h-px bg-current opacity-50"></div>
      </div>
    </div>`;
    if (!book.cover_url) return grad;
    return `<div class="${extra} rounded-2xl shadow-card overflow-hidden relative bg-gray-100"
                 data-fallback="${encodeURIComponent(grad)}">
      <img src="${book.cover_url}" alt="${book.title}" loading="lazy"
           class="w-full h-full object-cover"
           onerror="this.parentElement.innerHTML = decodeURIComponent(this.parentElement.dataset.fallback)" />
    </div>`;
  }

  function chipRow(label, options, key) {
    const chips = options.map(o => `
      <button onclick="setShelfFilter('${key}', '${String(o).replace(/'/g, "\\'")}')"
        class="px-3 py-1 rounded-full text-xs border transition ${SHELF_FILTER[key] === o
          ? 'bg-brand-500 text-white border-brand-500'
          : 'bg-white text-gray-600 border-gray-200 hover:border-brand-400'}">${o}</button>`).join('');
    return `<div class="flex items-center gap-2 flex-wrap"><span class="text-xs text-muted w-10">${label}</span>${chips}</div>`;
  }

  function renderShelfFilters() {
    const genres = [...new Set(ALL_BOOKS.map(b => b.genre).filter(Boolean))].sort();
    const levels = [...new Set(ALL_BOOKS.map(b => levelOf(b.word_count)))].sort();
    document.getElementById('shelf-filters').innerHTML =
      chipRow('分类', ['全部', ...genres], 'genre') + chipRow('难度', ['全部', ...levels], 'level');
  }

  function renderShelf() {
    const kw = SHELF_FILTER.search.trim().toLowerCase();
    const list = ALL_BOOKS.filter(b =>
      (SHELF_FILTER.genre === '全部' || (b.genre || 'Classic') === SHELF_FILTER.genre) &&
      (SHELF_FILTER.level === '全部' || levelOf(b.word_count) === SHELF_FILTER.level) &&
      (!kw || (b.title || '').toLowerCase().includes(kw) || (b.author || '').toLowerCase().includes(kw)));
    document.getElementById('shelf-count').textContent = `共 ${list.length} 本`;
    const grid = document.getElementById('book-grid');
    if (!list.length) {
      grid.innerHTML = '<div class="col-span-full text-center text-muted py-12">该筛选条件下暂无书籍</div>';
      return;
    }
    grid.innerHTML = list.map(b => `
      <div class="bg-white rounded-2xl shadow-soft overflow-hidden hover:shadow-card transition cursor-pointer group"
           onclick="openBook(${b.id})">
        ${coverHtml(b)}
        <div class="p-4">
          <p class="text-sm text-muted line-clamp-2 h-10">${b.synopsis || '暂无简介'}</p>
          <div class="flex items-center justify-between mt-3">
            <span class="text-xs text-muted">${b.word_count ? (b.word_count / 10000).toFixed(1) + ' 万词' : ''}</span>
            <span class="flex items-center gap-1">
              <span class="text-xs bg-emerald-50 text-emerald-600 px-2 py-1 rounded-lg">${levelOf(b.word_count)}</span>
              <span class="text-xs bg-brand-50 text-brand-600 px-2 py-1 rounded-lg">${b.genre || 'Classic'}</span>
            </span>
          </div>
        </div>
      </div>`).join('');
  }

  function setShelfFilter(key, value) {
    SHELF_FILTER[key] = value;
    renderShelfFilters();
    renderShelf();
  }

  // 搜索防抖
  let _searchTimer = null;
  function onSearchInput() {
    clearTimeout(_searchTimer);
    _searchTimer = setTimeout(() => {
      SHELF_FILTER.search = document.getElementById('search-input').value;
      renderShelf();
    }, 250);
  }

  // 点击书籍 → 记录待打开的书 → 跳转主页阅读页
  function openBook(bookId) {
    localStorage.setItem(PENDING_KEY, String(bookId));
    location.href = 'home.html#read';
  }

  // ================= 侧边栏收起 =================
  const SIDEBAR_KEY = 'era_sidebar_collapsed';
  function toggleSidebar(force) {
    const aside = document.getElementById('sidebar-aside');
    const collapsed = force !== undefined ? force : !aside.classList.contains('collapsed');
    aside.classList.toggle('collapsed', collapsed);
    document.getElementById('main-shift').classList.toggle('collapsed-main', collapsed);
    document.getElementById('sidebar-toggle-icon').className = collapsed ? 'fa fa-angle-right' : 'fa fa-angle-left';
    localStorage.setItem(SIDEBAR_KEY, collapsed ? '1' : '0');
  }
  if (localStorage.getItem(SIDEBAR_KEY) === '1') toggleSidebar(true);

  async function initUser() {
    document.getElementById('side-username').textContent = localStorage.getItem(USER_KEY) || '';
    document.getElementById('side-mini-avatar').textContent = ((localStorage.getItem(USER_KEY) || 'R')[0] || 'R').toUpperCase();
    document.getElementById('topbar-username').textContent = localStorage.getItem(USER_KEY) || '';
    document.getElementById('topbar-avatar').textContent = ((localStorage.getItem(USER_KEY) || 'R')[0] || 'R').toUpperCase();
    let level = null;
    try { level = (await api('/level-test/result')).level; } catch { level = null; }
    const levelText = level ? `${level} ${LEVEL_NAMES[level] || ''}` : '未测试';
    document.getElementById('side-level').textContent = '等级：' + levelText;
    document.getElementById('topbar-level').textContent = '等级：' + levelText;
  }

  // ================= 初始化 =================
  (async function init() {
    try {
      initUser(); // 不阻塞书架渲染
      ALL_BOOKS = await api('/books');
      renderShelfFilters();
      renderShelf();
    } catch (err) {
      toast('书架加载失败：' + err.message);
      document.getElementById('book-grid').innerHTML =
        '<div class="col-span-full text-center text-muted py-12">加载失败，请确认后端服务已启动后刷新页面。</div>';
    }
  })();
</script>

</body>
</html>
