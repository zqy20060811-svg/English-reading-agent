<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>English Reading — 登录 / 注册</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet" />
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          brand: {
            50: '#EEF6FF',
            100: '#D9EAFF',
            200: '#B3D4FF',
            400: '#6BA9FF',
            500: '#3B82F6',
            600: '#2563EB',
            700: '#1D4ED8'
          },
          mint: {
            400: '#34D399',
            500: '#10B981',
            600: '#059669'
          },
          cream: '#FBF7F1',
          ink: '#1F2937',
          muted: '#6B7280'
        },
        boxShadow: {
          soft: '0 10px 30px rgba(59, 130, 246, 0.08)',
          card: '0 20px 40px rgba(31, 41, 55, 0.08)',
          glow: '0 15px 40px rgba(59, 130, 246, 0.25)'
        },
        borderRadius: {
          xl2: '24px',
          xl3: '32px'
        }
      }
    }
  }
</script>
<style>
  body {
    font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    background: #FBF7F1;
    color: #1F2937;
  }

  /* 中文标题略收紧字距、加深笔画观感 */
  .heading-cn {
    letter-spacing: 0.01em;
  }

  .glass {
    background: rgba(255, 255, 255, 0.72);
    backdrop-filter: blur(14px);
    border: 1px solid rgba(255, 255, 255, 0.6);
  }

  .hero-gradient {
    background: linear-gradient(135deg, #EEF6FF 0%, #F0F9FF 45%, #FFFBEA 100%);
  }

  .tab-btn.active {
    color: #2563EB;
    border-bottom-color: #2563EB;
  }

  .fade-in {
    animation: fadeIn 0.4s ease both;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  .float {
    animation: float 6s ease-in-out infinite;
  }

  .shake {
    animation: shake 0.4s ease;
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }
</style>
</head>
<body class="min-h-screen">

<section class="min-h-screen hero-gradient relative overflow-hidden">
  <div class="absolute -top-24 -left-24 w-96 h-96 bg-brand-200 rounded-full opacity-60 blur-3xl"></div>
  <div class="absolute -bottom-32 -right-20 w-[28rem] h-[28rem] bg-yellow-200 rounded-full opacity-70 blur-3xl"></div>

  <nav class="relative z-10 flex items-center justify-between px-10 py-6">
    <div class="flex items-center gap-3">
      <div class="w-11 h-11 rounded-2xl bg-gradient-to-br from-brand-500 to-brand-400 flex items-center justify-center text-white text-xl shadow-glow">
        <i class="fa fa-book"></i>
      </div>
      <span class="text-xl font-bold text-ink">English Reading</span>
    </div>
    <div class="text-sm text-muted hidden md:block">AI 驱动的英语阅读与词汇学习</div>
  </nav>

  <div class="relative z-10 grid lg:grid-cols-2 gap-10 items-center max-w-7xl mx-auto px-10 py-10">

    <!-- 左侧品牌展示 -->
    <div class="space-y-8">
      <div class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-white/70 shadow-soft text-sm text-brand-700">
        <span class="w-2 h-2 rounded-full bg-mint-500"></span>
        AI 驱动的英语阅读与词汇学习
      </div>

      <h1 class="heading-cn text-[clamp(2.4rem,5vw,4rem)] font-extrabold leading-[1.15] text-ink">
        快乐阅读，
        <span class="bg-gradient-to-r from-brand-600 to-brand-400 bg-clip-text text-transparent">
          每天进步一点点
        </span>
      </h1>

      <p class="text-lg text-muted max-w-xl leading-relaxed">
        通过分级阅读、AI 词汇讲解和水平测试，建立稳定的英语阅读能力。每天 15 分钟，让阅读成为习惯。
      </p>

      <div class="grid grid-cols-3 gap-4 max-w-lg">
        <div class="glass rounded-2xl p-5 shadow-soft float">
          <div class="text-3xl font-bold text-brand-600">120+</div>
          <div class="text-sm text-muted mt-1">精选阅读材料</div>
        </div>
        <div class="glass rounded-2xl p-5 shadow-soft float" style="animation-delay: 1.2s">
          <div class="text-3xl font-bold text-brand-600">85%</div>
          <div class="text-sm text-muted mt-1">平均理解率</div>
        </div>
        <div class="glass rounded-2xl p-5 shadow-soft float" style="animation-delay: 2.4s">
          <div class="text-3xl font-bold text-brand-600">20k+</div>
          <div class="text-sm text-muted mt-1">活跃学习者</div>
        </div>
      </div>

      <!-- 漂浮书本视觉 -->
      <div class="relative h-56 mt-6">
        <div class="absolute left-4 top-4 w-40 h-52 rounded-2xl bg-gradient-to-br from-brand-400 to-brand-600 shadow-card rotate-[-8deg] flex items-end p-5 text-white">
          <div>
            <div class="text-xs opacity-80">畅销书</div>
            <div class="font-bold mt-1">Deep Focus</div>
          </div>
        </div>
        <div class="absolute left-44 top-0 w-44 h-60 rounded-2xl bg-gradient-to-br from-yellow-300 to-orange-400 shadow-card rotate-[4deg] flex items-end p-5 text-white z-10">
          <div>
            <div class="text-xs opacity-80">经典文学</div>
            <div class="font-bold mt-1">Atomic Habits</div>
          </div>
        </div>
        <div class="absolute left-[22rem] top-10 w-36 h-48 rounded-2xl bg-gradient-to-br from-mint-400 to-mint-600 shadow-card rotate-[-3deg] flex items-end p-5 text-white">
          <div>
            <div class="text-xs opacity-80">词汇积累</div>
            <div class="font-bold mt-1">Word Power</div>
          </div>
        </div>
      </div>
    </div>

    <!-- 右侧登录 / 注册卡片 -->
    <div class="glass rounded-3xl shadow-card p-8 max-w-md mx-auto w-full">
      <div id="auth-card">
        <div class="flex border-b border-gray-200 mb-6">
          <button id="auth-tab-login" class="tab-btn active px-5 py-3 font-semibold border-b-2 border-transparent transition" onclick="switchAuth('login')">
            登 录
          </button>
          <button id="auth-tab-register" class="tab-btn px-5 py-3 font-semibold text-muted border-b-2 border-transparent transition" onclick="switchAuth('register')">
            注 册
          </button>
        </div>

        <!-- 提示条（错误 / 成功） -->
        <div id="alert-box" class="hidden mb-4 p-3 rounded-xl text-sm"></div>

        <!-- 登录表单 -->
        <form id="auth-form-login" class="space-y-4 fade-in" onsubmit="return doLogin(event)">
          <div>
            <label class="text-sm text-muted">用户名</label>
            <input id="login-username" type="text" required autocomplete="username"
                   placeholder="请输入用户名"
                   class="mt-1 w-full px-4 py-3 rounded-xl bg-white border border-gray-200 focus:border-brand-500 focus:ring-2 focus:ring-brand-100 outline-none transition" />
          </div>
          <div>
            <label class="text-sm text-muted">密码</label>
            <input id="login-password" type="password" required autocomplete="current-password"
                   placeholder="请输入密码"
                   class="mt-1 w-full px-4 py-3 rounded-xl bg-white border border-gray-200 focus:border-brand-500 focus:ring-2 focus:ring-brand-100 outline-none transition" />
          </div>
          <button id="login-btn" type="submit"
                  class="w-full py-3 rounded-xl bg-gradient-to-r from-brand-600 to-brand-400 text-white font-semibold shadow-glow hover:shadow-xl transition disabled:opacity-60">
            登录，继续阅读
          </button>
          <div class="text-center text-sm text-muted">
            还没有账号？
            <a onclick="switchAuth('register')" class="text-brand-600 font-semibold cursor-pointer hover:underline">立即注册</a>
          </div>
        </form>

        <!-- 注册表单 -->
        <form id="auth-form-register" class="space-y-4 hidden fade-in" onsubmit="return doRegister(event)">
          <div>
            <label class="text-sm text-muted">用户名</label>
            <input id="register-username" type="text" required minlength="3" maxlength="50" autocomplete="username"
                   placeholder="至少 3 个字符"
                   class="mt-1 w-full px-4 py-3 rounded-xl bg-white border border-gray-200 focus:border-brand-500 focus:ring-2 focus:ring-brand-100 outline-none transition" />
          </div>
          <div>
            <label class="text-sm text-muted">邮箱</label>
            <input id="register-email" type="email" required autocomplete="email"
                   placeholder="you@example.com"
                   class="mt-1 w-full px-4 py-3 rounded-xl bg-white border border-gray-200 focus:border-brand-500 focus:ring-2 focus:ring-brand-100 outline-none transition" />
          </div>
          <div>
            <label class="text-sm text-muted">密码</label>
            <input id="register-password" type="password" required minlength="6" maxlength="64" autocomplete="new-password"
                   placeholder="至少 6 位"
                   class="mt-1 w-full px-4 py-3 rounded-xl bg-white border border-gray-200 focus:border-brand-500 focus:ring-2 focus:ring-brand-100 outline-none transition" />
          </div>
          <button id="register-btn" type="submit"
                  class="w-full py-3 rounded-xl bg-gradient-to-r from-brand-600 to-brand-400 text-white font-semibold shadow-glow hover:shadow-xl transition disabled:opacity-60">
            注册，开始学习
          </button>
        </form>
      </div>

      <!-- 登录成功后的欢迎卡片 -->
      <div id="welcome-card" class="hidden text-center py-6 fade-in">
        <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-mint-400 to-mint-600 mx-auto flex items-center justify-center text-white text-2xl shadow-glow">
          <i class="fa fa-check"></i>
        </div>
        <h3 class="text-2xl font-bold mt-5">欢迎回来，<span id="welcome-username"></span>！</h3>
        <p class="text-muted mt-2 text-sm">登录成功，登录凭证已保存在本地。</p>
        <p class="text-muted mt-1 text-sm">阅读、水平测试等功能页面正在开发中，敬请期待。</p>
        <button onclick="doLogout()" class="mt-6 px-6 py-2.5 rounded-xl border border-gray-200 text-muted hover:bg-gray-50 transition">
          退出登录
        </button>
      </div>
    </div>
  </div>
</section>

<script>
  // 后端 API 地址：本地开发环境 FastAPI 服务
  const API_BASE = 'http://127.0.0.1:8002';
  const TOKEN_KEY = 'era_access_token';
  const USER_KEY = 'era_username';

  function switchAuth(type) {
    const loginTab = document.getElementById('auth-tab-login');
    const registerTab = document.getElementById('auth-tab-register');
    const loginForm = document.getElementById('auth-form-login');
    const registerForm = document.getElementById('auth-form-register');
    hideAlert();

    const isLogin = type === 'login';
    loginTab.classList.toggle('active', isLogin);
    registerTab.classList.toggle('active', !isLogin);
    loginForm.classList.toggle('hidden', !isLogin);
    registerForm.classList.toggle('hidden', isLogin);
  }

  function showAlert(type, text) {
    const box = document.getElementById('alert-box');
    box.className = 'mb-4 p-3 rounded-xl text-sm ' + (
      type === 'error'
        ? 'bg-red-50 border border-red-100 text-red-600'
        : 'bg-mint-50 border border-mint-200 text-mint-700'
    );
    box.innerHTML = text;
    box.classList.remove('hidden');
    if (type === 'error') {
      box.classList.remove('shake');
      void box.offsetWidth; // 重新触发抖动动画
      box.classList.add('shake');
    }
  }

  function hideAlert() {
    document.getElementById('alert-box').classList.add('hidden');
  }

  function setLoading(btnId, loading, originalText) {
    const btn = document.getElementById(btnId);
    btn.disabled = loading;
    btn.innerHTML = loading
      ? '<i class="fa fa-circle-o-notch fa-spin mr-1"></i> 请稍候...'
      : originalText;
  }

  async function api(path, body, btnId, btnText) {
    setLoading(btnId, true, btnText);
    try {
      const resp = await fetch(API_BASE + path, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const data = await resp.json().catch(() => ({}));
      if (!resp.ok) {
        // FastAPI 校验错误在 detail 数组中，取第一条人性化展示
        let msg = data.detail || '请求失败';
        if (Array.isArray(msg)) msg = msg[0].msg;
        throw new Error(msg);
      }
      return data;
    } finally {
      setLoading(btnId, false, btnText);
    }
  }

  async function doRegister(event) {
    event.preventDefault();
    hideAlert();
    try {
      const user = await api('/auth/register', {
        username: document.getElementById('register-username').value.trim(),
        email: document.getElementById('register-email').value.trim(),
        password: document.getElementById('register-password').value,
      }, 'register-btn', '注册，开始学习');
      // 注册成功：预填用户名并切回登录页
      document.getElementById('login-username').value = user.username;
      switchAuth('login');
      showAlert('ok', `注册成功，<b>${user.username}</b> 已自动填入用户名，请登录。`);
    } catch (err) {
      showAlert('error', '注册失败：' + err.message);
    }
    return false;
  }

  async function doLogin(event) {
    event.preventDefault();
    hideAlert();
    try {
      const token = await api('/auth/login', {
        username: document.getElementById('login-username').value.trim(),
        password: document.getElementById('login-password').value,
      }, 'login-btn', '登录，继续阅读');
      localStorage.setItem(TOKEN_KEY, token.access_token);
      localStorage.setItem(USER_KEY, document.getElementById('login-username').value.trim());
      location.href = nextPath();
    } catch (err) {
      showAlert('error', '登录失败：' + (err.message === 'Failed to fetch'
        ? '无法连接后端服务，请确认服务已启动（http://127.0.0.1:8002）'
        : err.message));
    }
    return false;
  }

  function showWelcome(username) {
    hideAlert();
    document.getElementById('auth-card').classList.add('hidden');
    document.getElementById('welcome-username').textContent = username;
    document.getElementById('welcome-card').classList.remove('hidden');
  }

  function doLogout() {
    localStorage.removeItem(TOKEN_KEY);
    localStorage.removeItem(USER_KEY);
    document.getElementById('welcome-card').classList.add('hidden');
    document.getElementById('auth-card').classList.remove('hidden');
    document.getElementById('login-password').value = '';
    switchAuth('login');
  }

  // 登录后的落地页：优先 ?next= 回跳来源页（如书架页），默认学习中心
  function nextPath() {
    const next = new URLSearchParams(location.search).get('next');
    return next && next.startsWith('.html') ? next : 'home.html';
  }

  // 已登录用户直接进入学习中心（带 next 时回跳目标页）
  (function init() {
    const token = localStorage.getItem(TOKEN_KEY);
    const username = localStorage.getItem(USER_KEY);
    if (token && username) location.href = nextPath();
  })();
</script>

</body>
</html>
